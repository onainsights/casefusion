name: Prepare
description: Install dependencies and, unless disabled, build every workspace
inputs:
  build:
    description: Build the workspaces after installing
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Build
      if: inputs.build == 'true'
      shell: bash
      run: pnpm run build
      env:
        npm_config_workspace_concurrency: '1'
        NODE_OPTIONS: --max-old-space-size=6144
