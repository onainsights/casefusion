# Version updates for minor and patch releases only; major upgrades are planned in UPGRADE-PLAN.md.
# Security updates (including majors) come from Dependabot security updates, enabled in the repository settings.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directories: [/, /.github/actions/prepare]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
