name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare
        with:
          build: false
      - run: pnpm exec eslint .
      - run: pnpm exec prettier --check .

  test:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare
      - run: pnpm test
      # Same fresh production install as the Docker image; catches engine-strict failures a frozen install skips
      - run: pnpm --filter casefusion deploy --prod dist

  licenses:
    name: Dependency licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare
        with:
          build: false
      - run: pnpm licenses:check
      - name: No BUSL in our own packages
        run: |
          if git grep -n -E 'BUSL|BSUL' -- '*package.json' '*license'; then
            echo "BUSL found: an upstream merge re-added it (see UPSTREAM.md)"; exit 1
          fi

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Blocking: high and critical advisories in production dependencies fail the build. Accepted advisories are
      # listed in package.json (pnpm.auditConfig.ignoreGhsas) with their reasons in UPGRADE-PLAN.md.
      - name: Production dependencies
        run: pnpm audit --prod --audit-level high
      # Report-only: the app's packages are devDependencies because they are bundled, so --prod skips them. This covers
      # the bundle and the build and test tooling.
      - name: All dependencies, including the app bundle and tooling
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: pnpm audit --audit-level high
