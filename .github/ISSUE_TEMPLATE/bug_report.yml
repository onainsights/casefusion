name: Bug report
description: Something in CaseFusion does not work as expected
body:
  - type: markdown
    attributes:
      value: |
        Security issues: do not open an issue, see [security.md](https://github.com/onainsights/casefusion/blob/main/security.md).
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or image tag
      placeholder: e.g. main @ 1a2b3c4, or ghcr.io/onainsights/casefusion:sha-1a2b3c4
    validations:
      required: true
  - type: input
    id: database
    attributes:
      label: Database and Node.js version
      placeholder: e.g. PostgreSQL 16, Node 18.20
